<style id="site-style">
/* Layout: cinematic game hero (journey through six Himalayan stages, day and night), roadbook work grid, about, contact; owner-only editor drawer. */
:root {
  --bg: #E8ECEA; --surface: #F6F8F7; --ink: #17201E; --muted: #55625E; --line: #C6D0CD;
  --accent: #8C6410; --accent-ink: #FFFFFF; --accent-soft: #EDE2C6; --danger: #B3261E; --ok: #2E7D4F;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10161A; --surface: #172026; --ink: #E5ECEA; --muted: #93A29F; --line: #29363C;
  --accent: #D9B048; --accent-ink: #17140A; --accent-soft: #33301F; --danger: #F2827A; --ok: #7BD3A0; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10161A; --surface: #172026; --ink: #E5ECEA; --muted: #93A29F; --line: #29363C;
  --accent: #D9B048; --accent-ink: #17140A; --accent-soft: #33301F; --danger: #F2827A; --ok: #7BD3A0; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; }
img { max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
h1, h2, h3 { font-family: var(--f-display); line-height: .95; margin: 0; text-wrap: balance; letter-spacing: .005em; }
.eyebrow { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
.btn { font: 600 15px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; padding: 15px 22px; border: 2px solid var(--ink); border-radius: 3px; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; background: transparent; color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- Hero / game: one cinematic look in both themes ---------- */
.hero {
  --ink: #F4F0E8; --muted: #C9C1B2; --bg: #0E1318; --line: rgba(255,255,255,.14); --surface: rgba(255,255,255,.07);
  --accent: #F2B33D; --accent-ink: #1A1306; --glass: rgba(13,18,25,.6);
  color: var(--ink); color-scheme: dark;
  position: relative; overflow: hidden; background: #15161C; isolation: isolate;
  min-height: clamp(680px, 100vh, 1040px); min-height: clamp(680px, 100svh, 1040px);
  touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.hero a, .hero button { cursor: pointer; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 26px; }
.brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
.mark { display: inline-flex; gap: 7px; padding-left: 6px; }
.mark i { display: block; height: 22px; transform: skewX(-30deg); border-radius: 2px; }
.mark i:first-child { width: 58px; background: var(--ink); }
.mark i:last-child { width: 18px; background: var(--accent); }
.nav { display: flex; gap: clamp(16px, 3vw, 34px); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.nav a { text-decoration: none; padding-block: 5px; color: var(--muted); border-bottom: 2px solid transparent; }
.nav a:hover, .nav a:last-child { color: var(--ink); }
.nav a:hover { border-color: var(--accent); }
.hero-copy { padding-block: clamp(16px, 6vh, 90px) clamp(300px, 35vh, 390px); max-width: 640px; }
.hero .eyebrow { color: var(--accent); }
.hero h1 { font-size: clamp(44px, 5.6vw, 86px); font-weight: 900; text-transform: uppercase; margin-top: 16px; text-shadow: 0 2px 30px rgba(0,0,0,.35); }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: clamp(16px, 1.4vw, 19px); max-width: 42ch; margin: 18px 0 30px; color: #E2DCD0; }
.ctas { display: flex; gap: 14px; flex-wrap: wrap; }
.hero .btn { white-space: nowrap; border-radius: 5px; padding: 17px 20px; min-width: 210px; justify-content: space-between; font-size: 14px; letter-spacing: .1em; border-width: 1.5px; }
.hero .btn svg { width: 15px; height: 15px; flex: none; }
.hero .btn.primary { background: var(--ink); color: #11161B; border-color: var(--ink); box-shadow: 0 8px 28px rgba(0,0,0,.3); }
.hero .btn.ghost { background: rgba(13,18,25,.35); border-color: rgba(244,240,232,.8); color: var(--ink); backdrop-filter: blur(6px); }
.hero .btn:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.glass { background: var(--glass); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; backdrop-filter: blur(14px) saturate(1.15); -webkit-backdrop-filter: blur(14px) saturate(1.15); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
.player { position: absolute; top: 92px; right: clamp(16px, 4vw, 40px); width: 312px; font-family: var(--f-mono); font-size: 12px; overflow: hidden; cursor: default; }
.player .top { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; padding: 16px; align-items: center; border-bottom: 1px solid var(--line); }
.player .pic { width: 116px; height: 87px; border-radius: 7px; background: linear-gradient(160deg, #F39150, #D45F27); display: grid; place-items: center; overflow: hidden; }
.player .pic img { width: 94%; height: auto; display: block; }
.player .tag { display: inline-block; background: var(--accent); color: var(--accent-ink); letter-spacing: .16em; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 3px; }
.player .who { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; margin-top: 8px; overflow-wrap: anywhere; }
.player .mach { color: var(--muted); margin-top: 4px; }
.player ul { list-style: none; margin: 0; padding: 14px 16px 16px; display: grid; gap: 10px; }
.player li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 14px; align-items: center; color: #E2DCD0; }
.player li svg { width: 16px; height: 16px; color: var(--muted); }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; background: var(--surface); }
@media (max-width: 1100px) { .player { display: none; } }

.stagecard { position: absolute; left: clamp(16px, 4vw, 40px); bottom: 230px; text-align: left; pointer-events: none; opacity: 0; transform: translateY(8px); transition: opacity .6s ease, transform .6s ease; text-shadow: 0 2px 24px rgba(0,0,0,.55); max-width: calc(100% - 32px); }
.stagecard.show { opacity: 1; transform: none; }
.stagecard .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--accent); }
.stagecard b { display: block; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 4.4vw, 60px); line-height: .95; text-transform: uppercase; letter-spacing: .02em; margin: 6px 0 4px; }
.stagecard span.m { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: #E2DCD0; text-transform: uppercase; }
@media (min-width: 761px) { .stagecard { left: auto; right: clamp(16px, 4vw, 40px); bottom: auto; top: 104px; text-align: right; max-width: 420px; } }
@media (min-width: 1101px) { .stagecard { right: auto; left: 61%; transform: translate(-50%, 8px); text-align: center; max-width: 360px; } .stagecard.show { transform: translate(-50%, 0); } }

.route { position: absolute; left: 46%; top: 54%; display: flex; align-items: center; gap: 16px; padding: 14px 22px; pointer-events: none; }
.route .lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.route .lbl b { color: var(--ink); font-weight: 500; }
.route ol { display: flex; align-items: center; margin: 0; padding: 0; list-style: none; }
.route li { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12); position: relative; transition: background .3s, border-color .3s, box-shadow .3s; }
.route li + li { margin-left: 34px; }
.route li + li::before { content: ""; position: absolute; right: calc(100% + 5px); top: 50%; width: 26px; height: 1.5px; background: rgba(255,255,255,.28); }
.route li.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px rgba(242,179,61,.7); }
.route li.next { border-color: var(--accent); }
@media (max-width: 900px) { .route { display: none; } }

.dock { position: absolute; right: clamp(16px, 4vw, 40px); bottom: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; max-width: calc(100% - 32px); pointer-events: none; }
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; width: min(390px, 100%); }
.hud .cell { padding: 12px 16px 14px; display: grid; gap: 6px; min-width: 0; }
.hud .cell + .cell { border-left: 1px solid var(--line); }
.hud .k { display: flex; align-items: center; gap: 8px; color: var(--muted); letter-spacing: .12em; font-size: 10px; }
.hud .k svg { width: 15px; height: 15px; color: var(--ink); }
.hud b { font-weight: 500; font-size: 16px; color: var(--ink); white-space: nowrap; }
.hud .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
.hud .bar i { display: block; height: 100%; width: 0; background: rgba(255,255,255,.75); border-radius: 2px; transition: width .3s; }
.hud .cell:nth-child(2) .bar i, .hud .cell:nth-child(3) .bar i { background: var(--accent); }
.toast { pointer-events: auto; color: var(--ink); padding: 11px 16px; font-size: 14px; display: flex; gap: 12px; align-items: center; transform: translateY(8px); opacity: 0; transition: opacity .25s, transform .25s; max-width: 100%; border-radius: 10px; }
.toast.show { opacity: 1; transform: none; }
.toast b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--accent); font-weight: 600; white-space: nowrap; }
.toast a { color: var(--ink); font-weight: 600; white-space: nowrap; }

.finish { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(5,8,14,.55), rgba(5,8,14,.25)); cursor: default; z-index: 3; }
.finish .panel { width: min(520px, 100%); padding: clamp(22px, 4vw, 34px); text-align: left; animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.finish .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
.finish h2 { font-size: clamp(34px, 4.6vw, 52px); font-weight: 900; text-transform: uppercase; margin: 10px 0 12px; }
.finish p { margin: 0 0 8px; color: #E2DCD0; }
.finish .stats { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 14px 0 22px; text-transform: uppercase; }
.finish .stats b { color: var(--ink); font-weight: 500; }
.finish .row { display: flex; gap: 12px; flex-wrap: wrap; }
.finish .row .btn { min-width: 0; flex: 1 1 200px; }
.finish .x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 18px; line-height: 1; }
.finish .panel { position: relative; }
.finish .mailnote { font-family: var(--f-mono); font-size: 13px; user-select: all; overflow-wrap: anywhere; }

@media (max-width: 600px) {
  .hero-copy { padding-bottom: 360px; }
  .hero .btn { min-width: 0; flex: 1 1 auto; padding: 15px 16px; font-size: 13px; }
  .hud .cell { padding: 9px 10px 11px; } .hud b { font-size: 14px; }
  .mark i:first-child { width: 40px; } .mark i { height: 18px; }
  .nav { gap: 16px; font-size: 12px; }
}

/* Controls: keycap legend on desktop (clickable too), round touch buttons on phones */
.pad { position: absolute; left: clamp(16px, 4vw, 40px); bottom: 20px; display: flex; align-items: center; gap: 18px; cursor: default; touch-action: none; }
.pad-g { display: flex; gap: 8px; align-items: center; }
.pad button { touch-action: none; -webkit-user-select: none; user-select: none; min-width: 44px; height: 40px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.28); border-bottom-width: 3px; background: rgba(13,18,25,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font: 600 15px/1 var(--f-mono); display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.28); transition: transform .06s, background .1s; }
.pad button .lb, .pad .cap { font: 600 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pad .cap { margin-left: 2px; }
.pad .tc { display: none; }
.pad button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: translateY(2px); }
.pad button.on .lb { color: var(--accent-ink); }
.pad-c { display: none; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; color: var(--ink); background: rgba(13,18,25,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 10px; white-space: nowrap; }
@media (pointer: coarse), (max-width: 900px) {
  .pad { left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); justify-content: space-between; gap: 10px; padding-inline: 14px; }
  .pad-g { gap: 10px; }
  .pad .kc, .pad .cap { display: none; }
  .pad .tc { display: inline; }
  .pad button { width: 62px; height: 62px; padding: 0; border-radius: 50%; border-bottom-width: 1.5px; font: 600 20px/1 var(--f-body); }
  .pad button.w { width: 74px; border-radius: 31px; }
  .pad button .lb { font-size: 11px; color: var(--ink); }
  .pad-c { display: inline-block; }
  .hud { display: none; }
  .dock { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 380px) { .pad button { width: 54px; height: 54px; } .pad button.w { width: 64px; } .pad-c { display: none; } }

/* ---------- Sections ---------- */
section { padding-block: clamp(64px, 9vw, 112px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
.sec-head h2, .h2 { font-size: clamp(44px, 6vw, 76px); font-weight: 800; text-transform: uppercase; margin-top: 10px; }
.sec-head p.note { color: var(--muted); max-width: 38ch; margin: 0; font-size: 15px; }
.found-count { font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.found-count i { display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--accent); border-radius: 2px; }
.found-count i.on { background: var(--accent); }
.work { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px; }
@media (max-width: 960px) { .work { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .work { grid-template-columns: 1fr; } }
.card { display: grid; grid-template-rows: auto 1fr; text-decoration: none; min-width: 0; scroll-margin-top: 24px; }
.cover { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 4px; position: relative; overflow: hidden; background-color: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; transition: border-color .3s; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card:hover .cover img { transform: scale(1.03); }
.cover .glyph { font-family: var(--f-display); font-weight: 900; font-size: clamp(64px, 8vw, 96px); color: var(--ink); text-transform: uppercase; line-height: 1; transition: transform .4s ease; }
.card:hover .cover .glyph { transform: translateY(-6px) scale(1.04); }
.cover .wp { position: absolute; top: 12px; left: 12px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; background: var(--bg); border: 1px solid var(--line); padding: 3px 8px; border-radius: 3px; z-index: 1; }
.cover .stamp { position: absolute; bottom: 14px; right: 12px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); border: 2px solid var(--accent); padding: 4px 8px; border-radius: 3px; transform: rotate(-6deg); background: var(--bg); display: none; z-index: 1; }
.card.found .stamp { display: block; }
.card.found .cover { border-color: var(--accent); }
.card.flash .cover { animation: flash 1.2s ease; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 30% { box-shadow: 0 0 0 6px var(--accent-soft); } }
.v1 { background-image: repeating-radial-gradient(circle at 30% 70%, transparent 0 14px, var(--line) 14px 15px); }
.v2 { background-image: repeating-linear-gradient(-35deg, var(--accent-soft) 0 18px, transparent 18px 36px); }
.v3 { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 28px 28px; }
.v4 { background-image: radial-gradient(circle at 70% 35%, var(--accent-soft) 0 34%, transparent 34.5%); }
.v5 { background-image: radial-gradient(var(--line) 2px, transparent 2.5px); background-size: 18px 18px; }
.v0 { background-image: repeating-linear-gradient(90deg, transparent 0 22px, var(--accent-soft) 22px 26px), linear-gradient(transparent 60%, var(--accent-soft) 60%); }
.meta { padding-top: 16px; display: grid; gap: 6px; align-content: start; }
.meta .row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.meta h3 { font-size: 32px; font-weight: 800; text-transform: uppercase; margin-top: 6px; }
.card:hover h3 { color: var(--accent); }
.meta p { margin: 0; color: var(--muted); font-size: 16px; }

.about { background: var(--surface); border-block: 1px solid var(--line); }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.bio p { max-width: 60ch; margin: 0 0 18px; }
.bio p.big { font-size: 21px; font-weight: 500; line-height: 1.5; }
.kit { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; padding: 0; list-style: none; }
.kit li { font-size: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid var(--ink); padding: 6px 12px; border-radius: 2px; }
.logbook { border: 2px solid var(--ink); border-radius: 4px; background: var(--bg); }
.logbook header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 2px solid var(--ink); }
.logbook header h3 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
.logbook dl { margin: 0; }
.logbook .item { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 12px; padding: 12px 18px; border-bottom: 1px dashed var(--line); }
.logbook .item:last-child { border-bottom: 0; }
.logbook dt { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.logbook dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.contact h2 { font-size: clamp(56px, 10vw, 140px); font-weight: 900; text-transform: uppercase; margin-top: 12px; }
.contact h2 em { font-style: normal; color: var(--accent); }
.contact p.txt { max-width: 48ch; color: var(--muted); font-size: 19px; margin: 24px 0 32px; }

      <div class="meta"><div class="row"><span>${esc(p.type)}</span><span>${esc([p.year, p.length].filter(Boolean).join(" · "))}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p></div></a>`;
  }).join("");
  $("#about-body").innerHTML = String(C.about.body || "").split(/\n\s*\n/).filter(s => s.trim()).map(s => `<p>${esc(s.trim())}</p>`).join("");
  $("#kit").innerHTML = String(C.about.skills || "").split(",").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("");
  $("#log").innerHTML = C.about.log.map(r => `<div class="item"><dt>${esc(r.label)}</dt><dd>${esc(r.value)}</dd></div>`).join("");
  $("#contact-h").innerHTML = `${esc(C.contact.heading)} ${C.contact.headingEm ? `<em>${esc(C.contact.headingEm)}</em>` : ""}`;
  $("#mail").textContent = C.contact.email || "";
  $("#socials").innerHTML = C.contact.socials.filter(s => s.label).map(s => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join("");
  $("#foot-l").textContent = `© ${new Date().getFullYear()} ${S.name || ""}. ${S.footer || ""}`.trim();
  renderFound();
  game.contentChanged();
}

$("#copy").addEventListener("click", e => {
  const btn = e.currentTarget, mail = $("#mail");
  const done = m => { btn.textContent = m; setTimeout(() => (btn.textContent = "Copy email"), 1800); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents(mail); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done("Selected, press Ctrl+C"); };

/* =====================================================================
   Game
   ===================================================================== */
const game = (() => {
  const cv = $("#scene"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $dist = $("#hud-dist"), $flags = $("#hud-flags"), $alt = $("#hud-alt");
  const $bDist = $("#bar-dist"), $bFlags = $("#bar-flags"), $bAlt = $("#bar-alt"), $toast = $("#toast");
  let W = 0, H = 0, s = 1;
  const GRAV = 1500, JUMP_V = 400, STAGE_LEN = 1500;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const hash = n => { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); };
  const fmtKm = u => (u / 10000).toFixed(2) + " km";
  const fmtAlt = m => (Number(m) || 0).toLocaleString("en-IN") + " m";

  // Rider sprite geometry, measured on the supplied rider image (1432 × 1029 crop).
  const SPR = { aspect: 1029 / 1432, rear: { x: .15992, y: .78814, r: .14316 }, front: { x: .84008, y: .77843, r: .15782 }, ground: .9932, head: { x: .76327, y: .40233 }, tail: { x: .09986, y: .46161 } };

  // Day and night palettes for the trail; mixed by the night amount of the current stage blend.
  const hex = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const PAL = {
    day: { lit: "#C99358", mid: "#8A6038", dk: "#24180F", trail: "#E0B070", rock: "#33281F", rockHi: "#C08E5A", grass: "#B08F3C", log: "#5A3B22", fg: "#1D1510", rim: "#D69656", dust: "#DAB076" },
    night: { lit: "#56607E", mid: "#2C3248", dk: "#090B14", trail: "#76809F", rock: "#181B27", rockHi: "#6A779C", grass: "#4D566E", log: "#262A38", fg: "#080A12", rim: "#7E9AD8", dust: "#8C97B8" },
  };
  const RGB = { day: {}, night: {} };
  for (const k in PAL.day) { RGB.day[k] = hex(PAL.day[k]); RGB.night[k] = hex(PAL.night[k]); }
  let NA = 0; // night amount 0..1
  const col = (k, a = 1) => { const d = RGB.day[k], n = RGB.night[k]; return `rgba(${Math.round(lerp(d[0], n[0], NA))},${Math.round(lerp(d[1], n[1], NA))},${Math.round(lerp(d[2], n[2], NA))},${a})`; };
  const STARS = Array.from({ length: 90 }, (_, i) => ({ x: hash(i * 3.7), y: hash(i * 9.1) * .5, r: .5 + hash(i * 1.9) * 1.3, ph: hash(i * 5.3) * 6.28 }));

  // Image cache (stage backgrounds and rider), keyed by source.
  const cache = new Map();
  function img(src) {
    if (!src) return null;
    let r = cache.get(src);
    if (!r) { const im = new Image(); r = { im, ok: false }; im.onload = () => { r.ok = true; if (!running) draw(); }; im.src = src; cache.set(src, r); }
    return r.ok ? r.im : null;
  }

  const G = {
    state: "demo", camX: 1800, speed: 240, v: 240, rot: 0, wa: 0, wv: 0, loop: false, dist: 0, py: 0, vy: 0, grounded: true, hold: false,
    obs: [], flags: [], nextObs: 0, got: 0, crashT: 0, t: 0,
    stage: 0, prev: -1, trans: 1, stageCam: 1800, prevPan: .5, pan: .5,
  };
  const stages = () => C.stages;
  const projects = () => C.projects;
  const isNight = i => (stages()[i] || {}).mode === "night" ? 1 : 0;

  const groundH = () => Math.max(72, H * .15);
  const base = () => H - groundH();
  const gU = x => 12 * Math.sin(x * .0042) + 5 * Math.sin(x * .011 + 1.3) + 2 * Math.sin(x * .036 + .5);
  const gy = x => base() - gU(x) * s;
  const sx = x => (x - G.camX) * s;
  const playerOff = () => (W * (W < 700 ? .24 : .28)) / s;
  const px = () => G.camX + playerOff();
  const C2 = (x, y, r, c) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); };

  function resize() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    s = Math.max(.66, Math.min(1.75, Math.min(H / 560, W / 640)));
    if (!running) draw();
  }

  /* ----- stages ----- */
  let cardTimer = 0;
  function showStageCard() {
    const st = stages()[G.stage]; if (!st) return;
    $("#sc-k").textContent = `STAGE ${G.stage + 1} / ${stages().length} · ${st.mode === "night" ? "NIGHT" : "DAY"}`;
    $("#sc-name").textContent = st.name || "";
    $("#sc-meta").textContent = [st.region, st.altitude ? fmtAlt(st.altitude) : ""].filter(Boolean).join(" · ");
    const el = $("#stagecard"); el.classList.add("show");
    clearTimeout(cardTimer); cardTimer = setTimeout(() => el.classList.remove("show"), 3200);
  }
  function setStage(i, quiet) {
    i = clamp(i, 0, stages().length - 1);
    if (i !== G.stage) { G.prev = G.stage; G.prevPan = G.pan; G.stage = i; G.trans = 0; G.transStart = performance.now(); G.stageCam = G.camX; }
    if (!quiet) showStageCard();
    hud(true);
  }

  /* ----- world ----- */
  function spawn() {
    const limit = G.camX + W / s + 300;
    while (G.nextObs < limit) {
      const x = G.nextObs;
      if (!G.flags.some(f => !f.got && Math.abs(f.x - x) < 170)) {
        G.obs.push(Math.random() < .28 ? { x, kind: "log", w: 64, h: 18, seed: Math.random() } : { x, kind: "rock", w: rand(34, 50), h: rand(18, 30), seed: Math.random() });
      }
      const minGap = Math.max(320, 520 - G.dist * .004);
      G.nextObs += rand(minGap, minGap + 480);
    }
    G.obs = G.obs.filter(o => o.x > G.camX - 200);
  }
  function startRun() {
    G.state = "play"; G.dist = 0; G.py = 0; G.vy = 0; G.grounded = true; G.got = 0; G.wa = 0; G.wv = 0; G.loop = false;
    G.obs = []; G.nextObs = G.camX + W / s + 200;
    const start = px() + 700;
    G.flags = projects().map((_, i) => ({ x: start + i * STAGE_LEN + rand(0, 260), high: i % 2 === 1, i, got: false }));
    $("#finish").hidden = true;
    setStage(0);
  }
  function resume() {
    G.state = "play"; G.v = 0; G.speed = 0; G.py = 0; G.vy = 0; G.grounded = true; G.wa = 0; G.wv = 0; G.loop = false;
    const P = px();
    G.obs = G.obs.filter(o => o.x > P + 900 || o.x < P - 200);
    const next = G.flags.find(f => !f.got);
    if (next && next.x < P + 600) { const d = P + 600 - next.x; G.flags.forEach(f => { if (!f.got) f.x += d; }); }
    G.nextObs = Math.max(G.nextObs, P + 900);
  }
  function puff(wx, n) { for (let k = 0; k < n; k++) dust.push({ x: wx, y: gU(wx), vx: rand(-160, -40), vy: rand(20, 90), life: 1, sz: rand(3, 7) }); }
  function jump() { if (G.grounded && G.state === "play") { G.vy = JUMP_V; G.grounded = false; puff(px() - 52, 8); } }
  // Controls: → throttle, ← brake / reverse, Space jump (hold = higher), ↑ wheelie (hold).
  const keys = { left: false, right: false, wheelie: false, jump: false };
  function act(name, down) {
    if (G.state === "finish") return;
    if (down) {
      if (G.state === "demo") startRun();
      else if (G.state === "crash") { if (G.crashT > .7) resume(); else return; }
      wake();
    }
    keys[name] = down;
    const kb = hero.querySelector(`[data-ctl="${name}"]`); if (kb) kb.classList.toggle("on", down);
    if (name === "jump") { G.hold = down; if (down) jump(); }
  }
  const release = () => { for (const k in keys) keys[k] = false; G.hold = false; };

  /* ----- HUD, toast, finish ----- */
  let lastHud = 0, toastTimer = 0;
  function hud(force) {
    if (!force && G.t - lastHud < .15) return; lastHud = G.t;
    const n = projects().length, st = stages()[G.stage] || {};
    const maxAlt = Math.max(1, ...stages().map(x => Number(x.altitude) || 0));
    $dist.textContent = fmtKm(G.dist);
    $flags.textContent = `${G.got}/${n}`; $("#pad-flags").textContent = `${G.got}/${n}`;
    $alt.textContent = fmtAlt(st.altitude);
    $bDist.style.width = Math.min(100, (G.dist / (STAGE_LEN * Math.max(1, n) + 1400)) * 100) + "%";
    $bFlags.style.width = (n ? G.got / n * 100 : 0) + "%";
    $bAlt.style.width = ((Number(st.altitude) || 0) / maxAlt * 100) + "%";
    $("#route-lbl").innerHTML = `ROUTE · <b>${esc(st.name || "")}</b>`;
    [...$("#route").children].forEach((li, i) => { li.classList.toggle("on", i < G.got); li.classList.toggle("next", i === G.got && G.state === "play"); });
  }
  function toast(html, ms = 2800) { $toast.innerHTML = html; $toast.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove("show"), ms); }
  function collect(f) {
    f.got = true; G.got++;
    const p = projects()[f.i] || {}, n = projects().length;
    found.add(f.i); store.set("lwr-found2", [...found]); renderFound();
    const card = document.getElementById("p-" + (f.i + 1));
    if (card) { card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
    puff(f.x, 6);
    if (G.got >= n) { finish(); return; }
    const href = p.link ? safeUrl(p.link) : `#p-${f.i + 1}`;
    toast(`<b>FLAG ${f.i + 1}/${n}</b><span>${esc(p.title)}${p.type ? " · " + esc(p.type) : ""}</span><a href="${esc(href)}"${/^https?:/i.test(href) ? ' target="_blank" rel="noopener"' : ""}>View →</a>`);
    setStage(G.got);
  }
  function finish() {
    G.state = "finish"; release();
    const R = C.reward || {}, n = projects().length;
    $("#fin-k").textContent = R.kicker || "Route complete";
    $("#fin-h").textContent = R.enabled === false ? "Route complete" : (R.heading || "");
    $("#fin-t").textContent = R.enabled === false ? `You found all ${n} projects. Thanks for riding along.` : (R.text || "");
    $("#fin-stats").innerHTML = `<span>Distance <b>${fmtKm(G.dist)}</b></span><span>Projects <b>${n}/${n}</b></span><span>Stages <b>${stages().length}</b></span>`;
    const url = safeUrl(R.bookingUrl), mail = C.contact.email;
    let primary = "";
    if (R.enabled !== false) {
      if (url) primary = `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">${esc(R.button || "Book your free call")}${CHEV}</a>`;
      else if (mail) primary = `<a class="btn primary" href="mailto:${esc(mail)}?subject=${encodeURIComponent("Free consultation (finished the route)")}">${esc(R.button || "Book your free call")}${CHEV}</a>`;
    }
    $("#fin-row").innerHTML = `${primary}<button class="btn ghost" type="button" id="fin-again">Ride again${CHEV}</button>`;
    $("#finish").hidden = false;
    $("#fin-again").addEventListener("click", () => { $("#finish").hidden = true; G.camX += 400; startRun(); jump(); });
    store.set("lwr-finished", true);
  }
  $("#fin-x").addEventListener("click", () => { $("#finish").hidden = true; });

  /* ----- update ----- */
  const dust = [], debris = [];
  function crash(loop) { G.state = "crash"; G.crashT = 0; G.loop = !!loop; puff(px() + 50, 16); hud(true); }
  function update(dt) {
    G.t += dt;
    if (G.trans < 1) G.trans = Math.min(1, (performance.now() - (G.transStart || 0)) / 1600);
    if (G.state === "crash") { G.crashT += dt; G.v = G.v > 0 ? Math.max(0, G.v - 900 * dt) : Math.min(0, G.v + 900 * dt); }
    else if (G.state === "play") {
      if (keys.right) G.v = Math.min(420, G.v + (G.v < 0 ? 900 : 340) * dt);          // throttle
      else if (keys.left) G.v = G.v > 0 ? Math.max(0, G.v - 720 * dt) : Math.max(-150, G.v - 240 * dt); // brake, then reverse
      else G.v = G.v > 0 ? Math.max(0, G.v - 110 * dt) : Math.min(0, G.v + 300 * dt);  // roll off
    } else G.v = 240;
    G.speed = G.v;
    G.camX += G.v * dt; G.rot += G.v * dt / 23;
    if (G.state === "play") G.dist = Math.max(0, G.dist + G.v * dt);
    // wheelie: spring toward a balance point while ↑ is held; full throttle pushes past it and loops you out
    const wt = G.state === "play" && keys.wheelie ? (G.grounded ? (G.v > 40 ? (keys.right ? .95 : .5) : 0) : .3) : (G.state === "crash" && G.loop ? 1.5 : 0);
    G.wv += ((wt - G.wa) * 16 - G.wv * 5) * dt; G.wa += G.wv * dt;
    if (G.wa < 0) { if (G.wv < -1.4 && G.grounded) puff(px() + 56, 6); G.wa = 0; G.wv = 0; }
    if (G.state === "play" && G.wa > .8) crash(true);
    spawn();
    const X = px();
    if ((G.state === "demo" || G.state === "finish") && G.grounded) {
      const o = G.obs.find(o => o.x + o.w / 2 > X - 40);
      if (o) { const d = o.x - o.w / 2 - (X + 50); if (d > 0 && d < G.speed * .13) { G.vy = JUMP_V; G.grounded = false; } }
    }
    if (!G.grounded && G.state !== "crash") {
      const g = G.hold && G.vy > 0 && G.state === "play" ? GRAV * .5 : GRAV;
      G.vy -= g * dt; G.py += G.vy * dt;
      if (G.py <= 0) { G.py = 0; G.vy = 0; G.grounded = true; puff(X - 50, 10); puff(X + 54, 6); }
    }
    if (G.state === "play") {
      for (const o of G.obs) {
        if (!(o.x + o.w / 2 > X - 52 && o.x - o.w / 2 < X + 58 && G.py < o.h - 5)) continue;
        if (o.kind === "log" && G.wa > .22) { if (!o.rolled) { o.rolled = true; puff(o.x, 4); } continue; } // front up: roll over the log
        crash(); break;
      }
      for (const f of G.flags) {
        if (f.got || Math.abs(f.x - X) > 34) continue;
        const fy = f.high ? 225 : 70;
        if (fy >= G.py - 10 && fy <= G.py + 160) collect(f);
      }
    }
    // background pan: the picture slides left as the rider moves on through the stage
    const target = G.state === "play" || G.state === "crash" ? clamp((G.camX - G.stageCam) / STAGE_LEN, 0, 1) : .5 + .45 * Math.sin(G.t * .05);
    G.pan += (target - G.pan) * Math.min(1, dt * 1.5);
    for (let i = dust.length - 1; i >= 0; i--) { const p = dust[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 30 * dt; p.life -= dt * .9; p.sz += dt * 22; if (p.life <= 0) dust.splice(i, 1); }
    if (G.grounded && G.state !== "crash" && Math.abs(G.v) > 30) {
      const dir = G.v > 0 ? 1 : -1, amt = Math.min(1, Math.abs(G.v) / 300);
      for (let k = 0; k < 2; k++) if (Math.random() < amt + .2) dust.push({ x: X - 58 + rand(-4, 4), y: gU(X - 58) + 2, vx: -dir * rand(40, 150), vy: rand(14, 70), life: 1, sz: rand(4, 9) });
      if (Math.random() < .6 * amt) debris.push({ x: X - 56, y: 3, vx: -dir * rand(120, 300), vy: rand(90, 240), life: .8, sz: rand(1.4, 2.8) });
    }
    for (let i = debris.length - 1; i >= 0; i--) { const p = debris[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 900 * dt; p.life -= dt; if (p.life <= 0 || p.y < -6) debris.splice(i, 1); }
    hud();
  }

  /* ----- drawing ----- */
  function stageImage(st, pan, alpha, zoom) {
    const im = img(st && st.image); if (!im || alpha <= 0) return;
    const sc = Math.max(W / im.width, H / im.height) * 1.14 * zoom;
    const iw = im.width * sc, ih = im.height * sc;
    const cx = (Number(st.focus) || .5) + (pan - .5) * .18;
    const ox = clamp(W * (W < 760 ? .5 : .62) - cx * iw, W - iw, 0);
    const oy = (H - ih) * .55;
    ctx.globalAlpha = alpha; ctx.drawImage(im, ox, oy, iw, ih); ctx.globalAlpha = 1;
  }
  function backdrop() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, NA > .5 ? "#070B1C" : "#0F2340"); sky.addColorStop(1, NA > .5 ? "#1B2340" : "#6E4A2A");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const t = ease(G.trans), st = stages();
    if (G.prev >= 0 && t < 1) stageImage(st[G.prev], G.prevPan, 1, 1);
    stageImage(st[G.stage], G.pan, G.prev >= 0 ? t : 1, 1 + (1 - t) * .04);
    // grade: golden hour by day, cool moonlight by night
    ctx.save();
    if (NA < 1) { ctx.globalCompositeOperation = "soft-light"; ctx.fillStyle = `rgba(255,150,60,${(.4 * (1 - NA)).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.globalCompositeOperation = "multiply";
    let g = ctx.createLinearGradient(0, 0, 0, H * .55);
    g.addColorStop(0, `rgba(22,40,86,${(.75 * (1 - NA) + .4 * NA).toFixed(3)})`); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * .55);
    if (NA > 0) { ctx.fillStyle = `rgba(70,85,140,${(.35 * NA).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.globalCompositeOperation = "screen";
    if (NA < 1) { g = ctx.createRadialGradient(W * .74, H * .2, 0, W * .74, H * .2, Math.max(W, H) * .45); g.addColorStop(0, `rgba(255,190,120,${(.28 * (1 - NA)).toFixed(3)})`); g.addColorStop(1, "rgba(255,190,120,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    if (NA > 0) { g = ctx.createRadialGradient(W * .8, H * .14, 0, W * .8, H * .14, Math.max(W, H) * .3); g.addColorStop(0, `rgba(170,195,255,${(.16 * NA).toFixed(3)})`); g.addColorStop(1, "rgba(170,195,255,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
    if (NA > 0) for (const p of STARS) { const a = NA * (.35 + .35 * Math.sin(G.t * 2 + p.ph)); if (a > .02) C2(p.x * W, p.y * H, p.r, `rgba(235,240,255,${a.toFixed(3)})`); }
    // scrim behind the copy
    const a = .74;
    if (W >= 760) { g = ctx.createLinearGradient(0, 0, W * .62, 0); g.addColorStop(0, `rgba(7,11,19,${a})`); g.addColorStop(.5, `rgba(7,11,19,${a * .6})`); g.addColorStop(1, "rgba(7,11,19,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W * .62, H); }
    else { const yEnd = H - 250; g = ctx.createLinearGradient(0, 0, 0, yEnd); g.addColorStop(0, `rgba(7,11,19,${a})`); g.addColorStop(.82, `rgba(7,11,19,${a * .9})`); g.addColorStop(1, "rgba(7,11,19,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, yEnd); }
  }
  function trail() {
    const x0 = G.camX;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 5) ctx.lineTo(x, gy(x0 + x / s));
    ctx.lineTo(W, H); ctx.closePath();
    const gg = ctx.createLinearGradient(0, base() - 20 * s, 0, H); gg.addColorStop(0, col("lit")); gg.addColorStop(.35, col("mid")); gg.addColorStop(1, col("dk"));

function renderConnect() {

async function ghFetch(gh, path, opts = {}) {

const uploaded = new Map(); // data URL -> repository path, so a second publish reuses uploads

let openItem = null;
function buildAdmin() {
  adminEl.innerHTML = `<header><h2>Site editor</h2><span class="status" id="a-status">Saved</span><button class="abtn sm" type="button" data-act="close" aria-label="Close editor">✕</button></header>

function updateStatus(msg, kind) {

let applyQueued = false, draftTimer = 0;

function onAdminInput(e) {

async function onAdminChange(e) {

function fileToDataUrl(file, maxW, alpha) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {

function onAdminClick(e) {
  const b = e.target.closest("button, [data-tab]"); if (!b) return;

  if (b.dataset.tab) { tab = b.dataset.tab; openItem = null; adminEl.querySelectorAll("[data-tab]").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab)); renderAdmin(); $(".body", adminEl).scrollTop = 0; return; }

  if (b.dataset.add !== undefined) { const arr = getPath(C, sec.list); arr.push(clone(sec.blank)); openItem = sec.list + (arr.length - 1); renderAdmin(); changed(); return; }

async function saveConnection() {

const RESET = ":root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}";

    "<script type=\"application/json\" id=\"site-content\">" + json + "<\/script>\n" + $("#site-app").outerHTML + "</body></html>";
}
function buildHostedDocument(content) {

    "<title>" + title + "</title>\n<meta name=\"description\" content=\"" + desc + "\">\n<meta property=\"og:title\" content=\"" + title + "\">\n<meta property=\"og:description\" content=\"" + desc + "\">\n<meta property=\"og:type\" content=\"website\">\n" +
    "<link rel=\"icon\" href=\"" + icon + "\">\n" + $("#site-fonts").outerHTML + "\n" + $("#site-style").outerHTML + "\n</head>\n<body>\n<div id=\"root\"></div>\n" +

async function publishGitHub() {

let canEditSite = false, artifactCap = null;
